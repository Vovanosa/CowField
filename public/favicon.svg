<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CowField">
  <!--
    The source of truth for every icon the site ships. `npm run icons` rasterises this into
    favicon.ico and apple-touch-icon.png, so edit here and re-run rather than touching the output.

    WARNING, and it is not obvious: never write a double hyphen anywhere in these comments. XML
    forbids it inside a comment, and a standalone .svg is parsed as strict XML, so one occurrence
    makes the browser reject the entire file. It will still look fine everywhere you are likely to
    test it, because inline SVG in an HTML page goes through the lenient HTML parser instead. That
    is why the CSS custom properties below are named without their leading dashes. Caught by
    `scripts/check-icons` style decoding, not by any build step.

    Two more things are deliberate and easy to undo by accident:

    1. The background is opaque `#f7efe0`, the token `color-background`, the cream the whole site
       sits on. The icon this replaced was a near-white cow on transparency, which is invisible in a
       Google result row and in a light browser tab. An icon has no page behind it; it carries its own.
    2. It bleeds to the edge. Every consumer masks an icon to its own shape, Google rounds it, iOS
       squircles it, a tab crops it square. An inner rounded rectangle would get rounded twice and
       read as a sticker with a gap.

    Drawn at 64 rather than the old 220 because the weights have to survive 16px: the strokes are
    proportionally three times heavier, the head fills the frame, and the fine detail is gone. The
    two spots stay, because at tab size they are what still says "cow" once the outline has dissolved.
  -->
  <rect width="64" height="64" fill="#f7efe0"/>

  <g stroke="#7e4f47" stroke-width="2.4" stroke-linejoin="round">
    <ellipse cx="12" cy="30" rx="6" ry="8.5" fill="#e9b0bb"/>
    <ellipse cx="52" cy="30" rx="6" ry="8.5" fill="#e9b0bb"/>

    <path d="M21 17c-1.5-5 2.5-7.5 6-5.5-2 1.5-2.8 3.8-2.2 6" fill="#f3e3be"/>
    <path d="M43 17c1.5-5-2.5-7.5-6-5.5 2 1.5 2.8 3.8 2.2 6" fill="#f3e3be"/>

    <rect x="15" y="15" width="34" height="33" rx="13" fill="#fffdf8"/>
  </g>

  <path d="M22 21.6c-3-1-4.6 1.5-3.6 3.8 1 2.3 4.6 2.3 5.9 0.4 1-1.5 0.4-3.4-2.3-4.2Z" fill="#7e4f47"/>
  <path d="M41 20.4c3-0.6 4.4 1.9 3.4 4.1-1.1 2.2-4.5 1.9-5.7-0.1-0.9-1.6-0.1-3.4 2.3-4Z" fill="#7e4f47"/>

  <circle cx="25" cy="32" r="2.1" fill="#7e4f47"/>
  <circle cx="39" cy="32" r="2.1" fill="#7e4f47"/>

  <rect x="23.5" y="36" width="17" height="11" rx="5.5" fill="#e9b0bb" stroke="#7e4f47" stroke-width="2.4"/>
  <ellipse cx="28.5" cy="41.5" rx="1.5" ry="1.9" fill="#7e4f47"/>
  <ellipse cx="35.5" cy="41.5" rx="1.5" ry="1.9" fill="#7e4f47"/>
</svg>
