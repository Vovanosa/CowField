<!doctype html>
<!--
  Vercel serves this for any path that matches no rewrite in `vercel.json` and no file — with a real
  **404 status**, which is the point (item 87).

  Narrowing the rewrites is what stopped every mistyped URL returning 200 with the app, an unbounded
  supply of soft-404s for a crawler. This file is what stops that fix costing a person anything: they
  get a page that looks like the game rather than Vercel's default.

  Deliberately standalone — no React, no CSS module, no build step. It has to work when nothing else
  on the site has loaded, so the palette values are literal copies of the light and dark tokens from
  `src/styles/colors.css`. They only need to stay roughly in step; if they drift a little, this page
  is still a calm page with a working link.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>CowField — Page not found</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('cowfield.player-settings')
          var isDark = stored ? JSON.parse(stored).darkModeEnabled === true : false
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <style>
      :root {
        --surface: #fffaf1;
        --heading: #5e4622;
        --text: #7a6545;
        --accent: #9e7431;
        --border: rgba(148, 112, 38, 0.1);
      }

      :root[data-theme='dark'] {
        --surface: #201b17;
        --heading: #f3e1c1;
        --text: #dcc8a7;
        --accent: #d8b574;
        --border: rgba(214, 176, 111, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--surface);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 24px;
        text-align: center;
      }

      p.eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        letter-spacing: 0.16em;
        font-size: 0.76rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        color: var(--heading);
        font-size: 1.6rem;
        line-height: 1.2;
      }

      p.body {
        margin: 0 0 24px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 24px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">CowField</p>
      <h1>That link does not lead anywhere.</h1>
      <p class="body">The board is still where you left it.</p>
      <a href="/">Back to the start</a>
    </main>
  </body>
</html>
