<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Icons. All three are generated from `public/favicon.svg` by `npm run icons` — edit that file
      and re-run; the `.ico` and `.png` are build output and hand-editing them will be overwritten.

      **The order is the point.** A browser takes the last `rel="icon"` it understands, so the SVG
      wins everywhere current and the ICO is only ever fetched by something that cannot read it.
      Google's favicon crawler is the reason the ICO exists at all: it wants a square raster at 48px
      or a multiple, and has been unreliable about SVG. `sizes="32x32"` on the ICO is a hint, not a
      description — the file holds 16, 32 and 48.

      The icon before this was a near-white cow on a **transparent** background, which is invisible
      in a search result row and in a light tab. It now carries its own cream (`--color-background`),
      because an icon has no page behind it.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Static defaults, so a crawler that does not run JavaScript still gets a real title, a real
      description and a working share preview. `useDocumentMeta` overwrites all of this per route
      once the app boots; these values describe the landing page, because that is what `/` serves and
      `/` is what gets shared.

      The Open Graph image URL is **absolute** because most scrapers do not resolve a relative one.
      That means the domain is hardcoded here, as it is in `robots.txt` and `sitemap.xml` — those three
      files are what a move to a custom domain has to update, and `npm run check:seo` fails if they
      disagree with the URL it is pointed at.

      Measured before this existed (2026-09-10): every URL sent `<title>CowField</title>` and nothing
      else — no description, no canonical, no Open Graph.

      **CowField** is the product name everywhere — UI, titles, structured data, domain.
      P14 briefly used a different one (scope decision D1); it was dropped on 2026-09-10 over a
      naming concern, and the single name now matches the domain.

      **The brand goes last in the title (P17, 2026-09-11).** It used to go first, which spent the
      part of a search result Google weights most on a word nobody searches for. The query-bearing
      half leads now; see `brandedTitle` in `src/app/useDocumentMeta.ts`, which has to agree with
      this file for the landing page.
    -->
    <title>Play Star Battle online, free - CowField</title>
    <meta
      name="description"
      content="Play Star Battle online for free, no account needed. 1,000 puzzles from 6x6 to 15x15, the logic game also known as Two Not Touch. No timer unless you want one."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fffaf1" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CowField" />
    <meta property="og:title" content="Star Battle, with cows" />
    <meta
      property="og:description"
      content="A Star Battle puzzle, the game also called Two Not Touch. 1,000 levels from 6x6 to 15x15. Free, no account, and no timer unless you want one."
    />
    <meta property="og:image" content="https://cowfield.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A CowField puzzle board of coloured pens with bulls placed on it" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Star Battle, with cows" />
    <meta
      name="twitter:description"
      content="A Star Battle puzzle, the game also called Two Not Touch. 1,000 levels from 6x6 to 15x15. Free, no account, and no timer unless you want one."
    />
    <meta name="twitter:image" content="https://cowfield.vercel.app/og-image.png" />

    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('cowfield.player-settings')
          var isDark = stored ? JSON.parse(stored).darkModeEnabled === true : false
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
